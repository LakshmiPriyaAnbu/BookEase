<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="image-slot.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #E7E7EB; font-family: "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  @keyframes beShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  /* inspector chrome lives outside React-managed clicks */
  .be-ins { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  .be-ins ::-webkit-scrollbar { width: 8px; }
  .be-ins ::-webkit-scrollbar-thumb { background: #D2D4DC; border-radius: 8px; }
</style>
</helmet>

<div style="min-height: 100vh; background: #E7E7EB; color: #16181D;">

  <!-- ===== STICKY HEADER ===== -->
  <div style="position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.84); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #DEDFE6;">
    <div style="max-width: 1340px; margin: 0 auto; padding: 13px 30px; display: flex; align-items: center; gap: 18px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <div style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, #6B5BF0, #4A3BD0); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(74,59,208,0.35);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h7l-1 8 10-13h-7l0-7z" fill="#C8F25C"/></svg>
        </div>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; color: #0F1115;">BookEase</span>
        <span style="font-size: 11px; font-weight: 700; color: #5B4BE3; background: #EEEBFD; border-radius: 999px; padding: 4px 10px; margin-left: 2px; white-space: nowrap;">__KICKER__</span>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #545A66;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 3h6l1 4 4 1v6l-4 1-1 4H9l-1-4-4-1V8l4-1 1-4z" stroke="#5B4BE3" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="#5B4BE3"/></svg>
        <span>Click any element to inspect — size, padding, type & color tokens. <span style="color:#8A909C;">Press Esc to clear.</span></span>
      </div>
    </div>
  </div>

  <!-- ===== TITLE ===== -->
  <div style="max-width: 1340px; margin: 0 auto; padding: 40px 30px 8px;">
    <h1 style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.025em; margin: 0 0 6px; color: #0F1115;">__TITLE__</h1>
    <p style="font-size: 15px; color: #545A66; margin: 0; max-width: 70ch; line-height: 1.55;">__SUB__</p>
  </div>

  <!-- ===== BOARD ===== -->
  <div id="be-board" style="max-width: 1340px; margin: 0 auto; padding: 28px 30px 120px; display: flex; flex-wrap: wrap; gap: 44px 36px; align-items: flex-start; justify-content: center;">
    __SCREENS__
  </div>

</div>

</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const root = document.getElementById('be-board');
    if (!root || root.__beWired) return;
    root.__beWired = true;

    // ---- token maps ----
    const COLOR_TOKENS = {
      '#5b4be3':'--be-primary-600','#4a3bd0':'--be-primary-700','#eeebfd':'--be-primary-soft',
      '#c8f25c':'--be-accent-lime','#0e0f14':'--be-ink-900','#0f1115':'--be-ink-800',
      '#16181d':'--be-ink-700','#545a66':'--be-text-600','#8a909c':'--be-muted-500',
      '#b6bbc4':'--be-muted-400','#e2e3e9':'--be-border-200','#ececef':'--be-border-100',
      '#f0f0f4':'--be-divider','#ffffff':'--be-surface-0','#fbfbfc':'--be-surface-50',
      '#f4f4f7':'--be-surface-100','#f7f7fa':'--be-surface-150','#f2f2f5':'--be-surface-200',
      '#f5f5f8':'--be-app-bg','#16a34a':'--be-success','#15803d':'--be-success-text',
      '#e7f8ee':'--be-success-bg','#d97706':'--be-warning','#b45309':'--be-warning-text',
      '#fef3d9':'--be-warning-bg','#e11d48':'--be-danger','#be123c':'--be-danger-text',
      '#fce4e9':'--be-danger-bg','#2563eb':'--be-info','#1d4ed8':'--be-info-text',
      '#eaeffc':'--be-info-bg','#4a3dae':'--be-primary-700','#2c2370':'--be-ink-900'
    };
    const RADIUS_TOKENS = {8:'--be-radius-sm',11:'--be-radius-md',14:'--be-radius-lg',18:'--be-radius-xl',22:'--be-radius-2xl',999:'--be-radius-pill'};
    const SPACE_TOKENS = {4:'space-1',8:'space-2',12:'space-3',14:'space-4',16:'space-5',20:'space-6',24:'space-7',28:'space-8',32:'space-9',40:'space-10',48:'space-12',64:'space-16',72:'space-18'};
    const FONT_LABEL = (fam) => {
      const f = (fam||'').toLowerCase();
      if (f.includes('space grotesk')) return 'Space Grotesk · display';
      if (f.includes('plus jakarta')) return 'Plus Jakarta Sans · UI';
      if (f.includes('apple') || f.includes('system')) return 'SF Pro / system';
      return fam.split(',')[0].replace(/["']/g,'');
    };

    const rgbToHex = (s) => {
      const m = (s||'').match(/rgba?\(([^)]+)\)/);
      if (!m) return null;
      const p = m[1].split(',').map(x=>x.trim());
      const a = p[3] !== undefined ? parseFloat(p[3]) : 1;
      if (a === 0) return null;
      const h = p.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('');
      return { hex: '#'+h, a };
    };
    const tok = (hex) => hex && COLOR_TOKENS[hex.toLowerCase()] ? COLOR_TOKENS[hex.toLowerCase()] : null;
    const px = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? Math.round(n*10)/10 : 0; };
    const sides = (cs, p) => [px(cs[p+'Top']||cs[p+'-top']), px(cs[p+'Right']), px(cs[p+'Bottom']), px(cs[p+'Left'])];
    const fmtSides = (a) => (a[0]===a[1]&&a[1]===a[2]&&a[2]===a[3]) ? a[0]+'px' :
      (a[0]===a[2]&&a[1]===a[3]) ? a[0]+'px '+a[1]+'px' : a.map(x=>x+'px').join(' ');

    // ---- inspector DOM ----
    const sel = document.createElement('div');
    sel.className = 'be-ins';
    sel.style.cssText = 'position:fixed;pointer-events:none;z-index:999996;border:1.5px solid #5B4BE3;background:rgba(91,75,227,0.07);border-radius:2px;display:none;box-shadow:0 0 0 1px rgba(255,255,255,0.6);';
    const dim = document.createElement('div');
    dim.style.cssText = 'position:absolute;left:50%;top:100%;transform:translate(-50%,6px);background:#5B4BE3;color:#fff;font-size:11px;font-weight:700;font-family:Space Grotesk,sans-serif;padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 10px rgba(91,75,227,0.4);';
    sel.appendChild(dim);
    const hov = document.createElement('div');
    hov.className = 'be-ins';
    hov.style.cssText = 'position:fixed;pointer-events:none;z-index:999995;border:1px dashed #8273F0;background:rgba(91,75,227,0.04);border-radius:2px;display:none;';
    document.body.append(sel, hov);

    const panel = document.createElement('div');
    panel.className = 'be-ins';
    panel.style.cssText = 'position:fixed;top:74px;right:22px;width:316px;max-height:calc(100vh - 96px);overflow:auto;background:#fff;border:1px solid #E2E3E9;border-radius:16px;box-shadow:0 30px 70px -24px rgba(16,17,22,0.45);z-index:999997;display:none;';
    document.body.appendChild(panel);

    let selected = null;

    const place = (box, el) => {
      const r = el.getBoundingClientRect();
      box.style.left = r.left+'px'; box.style.top = r.top+'px';
      box.style.width = r.width+'px'; box.style.height = r.height+'px';
      box.style.display = 'block';
    };

    const row = (label, val, mono) => val ? `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px;"><span style="color:#8A909C;font-weight:600;flex-shrink:0;">${label}</span><span style="color:#16181D;font-weight:600;text-align:right;${mono?'font-family:Space Grotesk,monospace;':''}">${val}</span></div>` : '';
    const swatch = (hex) => `<span style="display:inline-block;width:13px;height:13px;border-radius:3px;background:${hex};box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);vertical-align:-2px;margin-right:6px;"></span>`;
    const colorRow = (label, info) => {
      if (!info) return '';
      const t = tok(info.hex);
      return `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px;align-items:center;"><span style="color:#8A909C;font-weight:600;">${label}</span><span style="text-align:right;">${swatch(info.hex)}<span style="font-family:Space Grotesk,monospace;font-weight:600;color:#16181D;">${info.hex.toUpperCase()}</span>${t?`<div style="font-size:10.5px;color:#5B4BE3;font-weight:700;margin-top:1px;">${t}</div>`:''}</span></div>`;
    };
    const head = (txt) => `<div style="font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B6BBC4;margin:16px 0 2px;">${txt}</div>`;

    const render = (el) => {
      const cs = getComputedStyle(el);
      const w = Math.round(el.offsetWidth*10)/10, h = Math.round(el.offsetHeight*10)/10;
      const tag = el.tagName.toLowerCase();
      let txt = ''; el.childNodes.forEach(n=>{ if(n.nodeType===3) txt += n.textContent; });
      txt = txt.trim().replace(/\s+/g,' ').slice(0,40);
      const hasText = txt.length > 0;

      const pad = sides(cs,'padding'), mar = sides(cs,'margin');
      const br = px(cs.borderTopLeftRadius);
      const brTok = RADIUS_TOKENS[br] ? RADIUS_TOKENS[br] : (br===999?RADIUS_TOKENS[999]:null);
      const bw = px(cs.borderTopWidth);
      const bcol = bw>0 ? rgbToHex(cs.borderTopColor) : null;
      const disp = cs.display;
      const isFlex = disp.includes('flex'), isGrid = disp.includes('grid');
      const gap = px(cs.gap||cs.gridGap);
      const bg = rgbToHex(cs.backgroundColor);
      const fg = rgbToHex(cs.color);
      const shadow = cs.boxShadow && cs.boxShadow !== 'none' ? cs.boxShadow : null;
      const opa = parseFloat(cs.opacity);
      const spaceHint = (v) => SPACE_TOKENS[v] ? ` <span style="color:#5B4BE3;font-weight:700;">·${SPACE_TOKENS[v]}</span>` : '';

      let html = '';
      html += `<div style="position:sticky;top:0;background:#fff;padding:15px 18px 12px;border-bottom:1px solid #F0F0F4;display:flex;align-items:flex-start;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:7px;"><span style="font-family:Space Grotesk,monospace;font-weight:700;font-size:14px;color:#5B4BE3;">&lt;${tag}&gt;</span></div>
          ${hasText?`<div style="font-size:12px;color:#8A909C;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">"${txt}"</div>`:''}
        </div>
        <button id="be-close" style="flex-shrink:0;width:26px;height:26px;border:1px solid #E2E3E9;background:#F7F7FA;border-radius:8px;color:#8A909C;font-size:15px;cursor:pointer;line-height:1;">×</button>
      </div>`;

      html += '<div style="padding:4px 18px 18px;">';
      // size
      html += `<div style="display:flex;gap:8px;margin:14px 0 4px;">
        <div style="flex:1;background:#F7F7FA;border-radius:10px;padding:10px 12px;"><div style="font-size:10px;color:#8A909C;font-weight:700;">WIDTH</div><div style="font-family:Space Grotesk,monospace;font-weight:700;font-size:17px;color:#0F1115;">${w}</div></div>
        <div style="flex:1;background:#F7F7FA;border-radius:10px;padding:10px 12px;"><div style="font-size:10px;color:#8A909C;font-weight:700;">HEIGHT</div><div style="font-family:Space Grotesk,monospace;font-weight:700;font-size:17px;color:#0F1115;">${h}</div></div>
      </div>`;

      // box
      html += head('Box');
      html += row('Padding', fmtSides(pad)===0+'px'?'':fmtSides(pad)+spaceHint(pad[0]), true);
      if (mar.some(x=>x!==0)) html += row('Margin', fmtSides(mar), true);
      if (br>0) html += row('Radius', (br===999?'999 (pill)':br+'px') + (brTok?` <span style="color:#5B4BE3;font-weight:700;">·${brTok}</span>`:''), true);
      if (bw>0 && bcol) html += `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px;align-items:center;"><span style="color:#8A909C;font-weight:600;">Border</span><span style="text-align:right;">${bw}px ${swatch(bcol.hex)}<span style="font-family:Space Grotesk,monospace;font-weight:600;">${bcol.hex.toUpperCase()}</span></span></div>`;

      // layout
      if (isFlex || isGrid || gap>0) {
        html += head('Layout');
        html += row('Display', disp, true);
        if (isFlex) html += row('Direction', cs.flexDirection, true);
        if (gap>0) html += row('Gap', gap+'px'+spaceHint(gap), true);
        if (isFlex||isGrid) { html += row('Align', cs.alignItems, true); html += row('Justify', cs.justifyContent, true); }
      }

      // type
      if (hasText) {
        html += head('Typography');
        html += row('Font', FONT_LABEL(cs.fontFamily));
        html += row('Size', px(cs.fontSize)+'px', true);
        html += row('Weight', cs.fontWeight, true);
        html += row('Line', px(cs.lineHeight)?px(cs.lineHeight)+'px':cs.lineHeight, true);
        if (cs.letterSpacing && cs.letterSpacing!=='normal') html += row('Tracking', cs.letterSpacing, true);
        if (cs.textAlign && cs.textAlign!=='start' && cs.textAlign!=='left') html += row('Align', cs.textAlign, true);
        html += colorRow('Text', fg);
      }

      // fill
      html += head('Fill & effects');
      html += colorRow('Background', bg) || row('Background','transparent');
      if (opa < 1) html += row('Opacity', opa, true);
      if (shadow) html += `<div style="padding:6px 0;font-size:12px;"><span style="color:#8A909C;font-weight:600;">Shadow</span><div style="font-family:Space Grotesk,monospace;font-size:10.5px;color:#16181D;margin-top:4px;word-break:break-all;line-height:1.4;">${shadow}</div></div>`;

      html += `<button id="be-copy" style="width:100%;margin-top:18px;font-family:inherit;cursor:pointer;border:none;background:#5B4BE3;color:#fff;font-weight:700;font-size:13px;padding:11px;border-radius:10px;box-shadow:0 6px 16px rgba(91,75,227,0.28);">Copy CSS</button>`;
      html += '</div>';
      panel.innerHTML = html;

      panel.querySelector('#be-close').onclick = clear;
      panel.querySelector('#be-copy').onclick = (ev) => {
        const lines = [];
        lines.push('width: '+w+'px;'); lines.push('height: '+h+'px;');
        if (fmtSides(pad)!=='0px') lines.push('padding: '+fmtSides(pad)+';');
        if (br>0) lines.push('border-radius: '+(br===999?'999px':br+'px')+';');
        if (bw>0 && bcol) lines.push('border: '+bw+'px solid '+bcol.hex+';');
        if (isFlex||isGrid){ lines.push('display: '+disp+';'); if(gap>0)lines.push('gap: '+gap+'px;'); }
        if (hasText){ lines.push('font-family: '+cs.fontFamily.split(',')[0].replace(/"/g,'')+';'); lines.push('font-size: '+px(cs.fontSize)+'px;'); lines.push('font-weight: '+cs.fontWeight+';'); if(fg)lines.push('color: '+fg.hex+';'); }
        if (bg) lines.push('background: '+bg.hex+';');
        if (shadow) lines.push('box-shadow: '+shadow+';');
        const css = lines.join('\n');
        navigator.clipboard && navigator.clipboard.writeText(css).then(()=>{
          ev.target.textContent='Copied ✓'; setTimeout(()=>ev.target.textContent='Copy CSS',1300);
        }).catch(()=>{ ev.target.textContent='Copied ✓'; setTimeout(()=>ev.target.textContent='Copy CSS',1300); });
      };

      dim.textContent = w+' × '+h;
      place(sel, el);
    };

    const selectEl = (el) => { selected = el; panel.style.display='block'; render(el); };
    const clear = () => { selected=null; panel.style.display='none'; sel.style.display='none'; };

    root.addEventListener('mousemove', (e) => {
      if (!selected || e.target !== selected) {
        const t = e.target.closest && e.target.closest('.be-screen *');
        if (t && t !== selected) { place(hov, t); return; }
      }
      hov.style.display='none';
    });
    root.addEventListener('mouseleave', () => hov.style.display='none');

    root.addEventListener('click', (e) => {
      const t = e.target;
      if (!t.closest || !t.closest('.be-screen')) return;
      e.preventDefault(); e.stopPropagation();
      hov.style.display='none';
      selectEl(t === selected && t.parentElement && t.parentElement.closest('.be-screen') ? t.parentElement : t);
    }, true);

    const reposition = () => { if (selected) place(sel, selected); hov.style.display='none'; };
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition);
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') clear(); });
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
